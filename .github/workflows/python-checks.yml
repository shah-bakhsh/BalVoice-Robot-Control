name: Source and checkpoint integrity
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q app.py recognizer.py motor_link.py research_dual_models tests
      - name: Check checkpoint integrity
        run: sha256sum -c MODEL_SHA256SUMS
      - name: Run unit tests (does not move motors)
        run: python -m unittest discover -s tests -v
