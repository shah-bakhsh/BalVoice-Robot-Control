<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Balochi Robot Voice Test</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eff4fa;background:#101823}*{box-sizing:border-box}body{margin:0;padding:26px 15px;display:flex;justify-content:center}.wrap{width:100%;max-width:520px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{font-size:12px;padding:7px 11px;border:1px solid #38506a;border-radius:30px}.card{margin-top:20px;background:#192639;border:1px solid #33485f;border-radius:18px;padding:23px;text-align:center}h1{font-size:24px;margin:8px 0}p{color:#b6c6d5}select{background:#0e1724;color:white;padding:13px;border-radius:11px;border:1px solid #536b84;width:100%;font-size:16px;margin:10px 0 18px}button{background:#227ce0;color:white;border:0;border-radius:50%;height:128px;width:128px;font-size:17px;font-weight:700;touch-action:manipulation}button:disabled{background:#637588}.state{padding:16px;background:#111b29;border-radius:12px;margin-top:22px;text-align:left}.value{font-size:26px;font-weight:750;word-break:break-word}.code{font-size:22px;color:#72daac}.small{font-size:13px;color:#b6c6d5}.safe{font-size:12px;color:#efcf7f;margin-top:20px}label{display:block;font-size:14px;text-align:left;color:#c7d5e5}hr{border:0;border-top:1px solid #3d5065;margin:16px 0}
</style></head><body><div class="wrap"><header class="top"><strong>🎙️ Robot Voice Test</strong><span class="pill" id="online">Connecting…</span></header><div class="card"><h1>English + Balochi</h1><p>One tap, one voice command. Shows what the Raspberry Pi recognized.</p><label for="mode">Language</label><select id="mode"><option value="balochi">Balochi — compare two models</option><option value="english">English — Vosk</option><option value="auto">Auto — both languages</option></select><button id="speak">🎤 Speak</button><p id="prompt" class="small">Tap once; records for 3 seconds.</p><div class="state"><div class="small">Recognition</div><div id="heard" class="value">Waiting for voice…</div><div id="action" class="code">—</div><hr><div class="small" id="svm">SVM prediction: —</div><div class="small" id="cnn">CNN prediction: —</div><div class="small" id="err"></div></div><div class="safe">TEST ONLY • Arduino disconnected in software • No motor commands</div></div></div><script>
const btn=document.getElementById('speak'), status=document.getElementById('online'),prompt=document.getElementById('prompt');
(async()=>{try{const r=await fetch('/health');const j=await r.json();status.textContent=j.server==='ready'?'Pi connected':'Pi unavailable'}catch{status.textContent='Not connected'}})();
btn.onclick=async()=>{btn.disabled=true;document.getElementById('err').textContent='';prompt.textContent='Recording…';let stream=null;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});let mediaType=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'';const rec=new MediaRecorder(stream,mediaType?{mimeType:mediaType}:undefined),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const finished=new Promise((resolve,reject)=>{rec.onstop=resolve;rec.onerror=reject});rec.start();await new Promise(r=>setTimeout(r,3000));rec.stop();await finished;stream.getTracks().forEach(t=>t.stop());stream=null;prompt.textContent='Recognizing on Raspberry Pi…';const form=new FormData();form.append('file',new Blob(chunks,{type:rec.mimeType||'audio/webm'}),'command.webm');form.append('mode',document.getElementById('mode').value);const response=await fetch('/recognize',{method:'POST',body:form});const data=await response.json();if(!response.ok)throw Error(data.detail||'Recognition error');document.getElementById('heard').textContent=data.recognized||'Not recognized';document.getElementById('action').textContent=(data.candidate_action||'REJECTED')+(data.candidate_arduino_code?' ('+data.candidate_arduino_code+')':'');const b=data.balochi_models||{};document.getElementById('svm').textContent=b.svm?'SVM: '+b.svm.phrase+' ('+b.svm.score+')':'SVM: —';document.getElementById('cnn').textContent=b.cnn?'CNN: '+b.cnn.phrase+' ('+b.cnn.score+')':'CNN: —';prompt.textContent='Finished · Tap to speak again';}catch(e){document.getElementById('err').textContent=String(e);prompt.textContent='Microphone or server error'}finally{if(stream)stream.getTracks().forEach(t=>t.stop());btn.disabled=false}};
</script></body></html>
